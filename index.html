<style>
  :root{

    --coral:#FF7A6B; --violet:#5E60CE; --ink:#23414D; --ink-soft:#5E7986;
    --ground:#FFF7EC; --card:#FFFFFF; --line:#F0E2CC; --chip:#E6F5F3;
    --good:#2FA05A; --shadow:0 10px 26px rgba(35,65,77,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#EDF4F2; --ink-soft:#9DB4AE; --ground:#111F1E; --card:#1B2E2C;
      --line:#2A4340; --chip:#173734; --gold:#FFCB55; --coral:#FF8B7D;
      --shadow:0 10px 26px rgba(0,0,0,.35); }
  }
  :root[data-theme="dark"]{ --ink:#EDF4F2; --ink-soft:#9DB4AE; --ground:#111F1E; --card:#1B2E2C;
    --line:#2A4340; --chip:#173734; --gold:#FFCB55; --coral:#FF8B7D;
    --shadow:0 10px 26px rgba(0,0,0,.35); }
  :root[data-theme="light"]{ --ink:#23414D; --ink-soft:#5E7986; --ground:#FFF7EC; --card:#FFFFFF;
    --line:#F0E2CC; --chip:#E6F5F3; --gold:#F4B93C; --coral:#FF7A6B;
    --shadow:0 10px 26px rgba(35,65,77,.10); }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--ground); color:var(--ink);
       font-family:"Segoe UI","Tahoma","Arial",sans-serif}
  button{font-family:inherit; cursor:pointer; border:0; color:inherit}
  button:focus-visible, input:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
  input,select{font-family:inherit}

  .page{max-width:960px; margin:0 auto; padding:22px 14px 44px; display:flex; flex-direction:column; align-items:center; gap:14px}
  .top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center}
  .logo{display:flex; align-items:center; gap:10px}
  .logo h1{margin:0; font-size:26px; font-weight:800; letter-spacing:-.01em}
  .logo .en{font-size:10.5px; letter-spacing:.24em; color:var(--ink-soft); font-weight:800; display:block; margin-top:-2px}
  .who{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:5px 6px 5px 14px; box-shadow:var(--shadow); font-size:13.5px; font-weight:700}
  .who .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-size:17px}
  .who button{background:var(--chip); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:700; color:var(--teal-deep)}
  :root[data-theme="dark"] .who button{color:var(--teal)}
  .sync{font-size:12px; color:var(--ink-soft); text-align:center}

  .phone{width:376px; max-width:100%; background:var(--card); border:1px solid var(--line);
    border-radius:42px; padding:11px; box-shadow:var(--shadow)}
  .screen{border-radius:32px; overflow:hidden; background:var(--ground); border:1px solid var(--line);
    height:706px; display:flex; flex-direction:column; position:relative}
  .body{flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom:10px}

  .hero{color:#fff; padding:17px 18px 46px; position:relative;
    background:linear-gradient(160deg,var(--teal) 0%,var(--teal-deep) 100%)}
  .hero.parent{background:linear-gradient(160deg,#2E5A6B,#1B3A47)}
  .hero .hi{font-size:12.5px; opacity:.85; margin:0 0 2px}
  .hero h2{margin:0; font-size:19.5px; font-weight:800; padding-inline-end:80px; text-wrap:balance; line-height:1.35}
  .hero .side-el{position:absolute; inset-inline-end:14px; top:12px; text-align:center}
  .mascot-chip{display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,.18);
    border-radius:999px; padding:3px 9px; font-size:10.5px; font-weight:700; color:#fff; margin-top:3px}

  .float-card{margin:-34px 14px 0; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:14px 16px; box-shadow:var(--shadow); position:relative}
  .sec{padding:14px 14px 2px}
  .sec-t{font-size:12.5px; font-weight:800; color:var(--ink-soft); margin:0 2px 8px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px 14px; margin-bottom:10px}
  .row{display:flex; align-items:center; gap:11px}
  .grow{flex:1; min-width:0}
  .muted{color:var(--ink-soft)} .small{font-size:12.5px} .num{font-variant-numeric:tabular-nums}

  .bar{height:13px; border-radius:999px; background:var(--chip); overflow:hidden; position:relative}
  .bar>i{position:absolute; inset-block:0; inset-inline-start:0; border-radius:999px; display:block;
    background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
  @media (prefers-reduced-motion: no-preference){ .bar>i{transition:width .5s ease} }

  .ico{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--chip);flex:0 0 auto}
  .t-name{font-size:14.5px;font-weight:700;margin:0}
  .t-sub{font-size:12.5px;color:var(--ink-soft);margin:2px 0 0; line-height:1.6}
  .t-sub b{color:var(--teal-deep)}
  :root[data-theme="dark"] .t-sub b{color:var(--teal)}

  .btn{border-radius:999px; padding:9px 15px; font-size:13.5px; font-weight:700}
  .btn-teal{background:var(--teal); color:#fff}
  .btn-gold{background:var(--gold); color:#5B4300}
  .btn-ghost{background:var(--chip); color:var(--teal-deep)}
  :root[data-theme="dark"] .btn-ghost{color:var(--teal)}
  .btn-coral{background:#FFEDEA; color:#B3402F}
  :root[data-theme="dark"] .btn-coral{background:#4A2622; color:#FFB4A8}
  .btn[disabled]{opacity:.45; cursor:not-allowed}
  .btn-sm{padding:7px 11px; font-size:12px}

  .stamp{display:inline-flex; align-items:center; gap:5px; background:var(--chip); color:var(--teal-deep);
    font-size:12px; font-weight:700; border-radius:999px; padding:7px 11px; flex:0 0 auto}
  :root[data-theme="dark"] .stamp{color:var(--teal)}
  .stamp.ok{background:#E7F6EC; color:#1F7A42}
  :root[data-theme="dark"] .stamp.ok{background:#1E3A2A; color:#7BD8A0}
  .stamp.no{background:#FFEDEA; color:#B3402F}
  :root[data-theme="dark"] .stamp.no{background:#4A2622; color:#FFB4A8}

  .beads{display:flex; gap:5px; margin-top:6px}
  .bead{width:16px;height:16px;border-radius:50%;background:var(--chip);border:2px solid var(--line)}
  .bead.on{background:var(--gold); border-color:var(--gold-deep)}

  .quest{background:linear-gradient(150deg,var(--violet),#4348A8); color:#fff; border:0}
  .quest .bar{background:rgba(255,255,255,.22)}
  .quest .t-sub{color:rgba(255,255,255,.85)} .quest .t-sub b{color:#FFD98A}

  .jar{width:82px; height:106px; border:3px solid var(--gold-deep); border-radius:14px 14px 26px 26px;
    position:relative; overflow:hidden; background:var(--card); flex:0 0 auto}
  .jar::before{content:""; position:absolute; top:-3px; left:14px; right:14px; height:8px; background:var(--gold-deep); border-radius:0 0 8px 8px}
  .jar>i{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg,var(--gold),var(--gold-deep)); display:block}
  .jar .pct{position:absolute; inset:0; display:grid; place-items:center; font-weight:800; font-size:15px; color:var(--ink)}
  @media (prefers-reduced-motion: no-preference){ .jar>i{transition:height .5s ease} }

  .nav{display:flex; justify-content:space-around; padding:9px 6px 12px; background:var(--card); border-top:1px solid var(--line)}
  .nav button{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; color:var(--ink-soft); font-weight:700; background:none; padding:0 5px}
  .nav button .dot{width:34px;height:31px;border-radius:12px;display:grid;place-items:center;font-size:17px}
  .nav button.on{color:var(--teal-deep)} :root[data-theme="dark"] .nav button.on{color:var(--teal)}
  .nav button.on .dot{background:var(--chip)}
  .nav .badge{position:relative}
  .nav .badge::after{content:attr(data-n); position:absolute; top:-3px; inset-inline-start:-3px; background:var(--coral); color:#fff;
    font-size:9.5px; font-weight:800; border-radius:999px; min-width:16px; height:16px; display:grid; place-items:center; padding:0 4px}

  .rw-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 14px}
  .rw{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:11px; text-align:center; position:relative}
  .rw .big{font-size:32px} .rw .nm{font-size:13px; font-weight:700; margin:5px 0 2px}
  .rw .cost{font-size:12px; color:var(--gold-deep); font-weight:800} :root[data-theme="dark"] .rw .cost{color:var(--gold)}
  .rw .btn{width:100%; margin-top:7px; padding:7px 0; font-size:12.5px}
  .rw .fav{position:absolute; top:7px; inset-inline-start:7px; font-size:14px}

  .value-week{background:linear-gradient(150deg,var(--gold),var(--gold-deep)); color:#5B3F00; border:0}
  .meter{height:15px; border-radius:999px; overflow:hidden; display:flex}
  .meter .pos{background:var(--teal)} .meter .neg{background:var(--coral)}

  .toggle{width:46px; height:26px; border-radius:999px; background:var(--chip); position:relative; flex:0 0 auto; border:1px solid var(--line)}
  .toggle::after{content:""; position:absolute; top:2px; inset-inline-end:2px; width:20px; height:20px; border-radius:50%; background:var(--ink-soft)}
  .toggle.on{background:var(--teal)}
  .toggle.on::after{inset-inline-end:auto; inset-inline-start:2px; background:#fff}
  @media (prefers-reduced-motion: no-preference){ .toggle::after{transition:all .2s ease} }

  .stepper{display:flex; align-items:center; gap:6px; flex:0 0 auto}
  .stepper button{width:29px; height:29px; border-radius:10px; background:var(--chip); color:var(--teal-deep); font-size:16px; font-weight:800; display:grid; place-items:center}
  :root[data-theme="dark"] .stepper button{color:var(--teal)}
  .stepper .v{min-width:38px; text-align:center; font-weight:800; font-size:14.5px}
  .seg{display:flex; background:var(--chip); border-radius:999px; padding:3px; gap:3px; flex:0 0 auto}
  .seg button{border-radius:999px; padding:5px 9px; font-size:11px; font-weight:700; background:transparent; color:var(--ink-soft)}
  .seg button.on{background:var(--card); color:var(--teal-deep); box-shadow:0 1px 4px rgba(0,0,0,.12)}
  :root[data-theme="dark"] .seg button.on{color:var(--teal)}

  .wiz{display:flex; flex-direction:column; height:100%; background:var(--ground)}
  .wiz-body{flex:1; overflow-y:auto; padding:18px 15px 10px}
  .wiz-foot{display:flex; gap:9px; padding:11px 13px; border-top:1px solid var(--line); background:var(--card)}
  .wiz-foot .btn{flex:1; padding:12px 0; font-size:15px}
  .dots{display:flex; gap:5px; justify-content:center; padding:11px 0 2px}
  .dots i{width:7px; height:7px; border-radius:50%; background:var(--line)}
  .dots i.on{background:var(--teal); width:19px; border-radius:999px}
  .wiz h2{font-size:20px; margin:5px 0 4px; text-wrap:balance}
  .wiz .lead{color:var(--ink-soft); font-size:13.5px; line-height:1.8; margin:0 0 15px}
  .inp{width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:13px;
    font-size:15px; background:var(--card); color:var(--ink)}
  .inp:focus{outline:none; border-color:var(--teal)}
  .lbl{font-size:12px; font-weight:700; color:var(--ink-soft); margin:0 2px 6px; display:block}
  .sel{padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font-size:14.5px}
  .gpill{display:flex; background:var(--chip); border-radius:999px; padding:3px; gap:3px}
  .gpill button{border-radius:999px; padding:7px 12px; font-size:14px; background:transparent}
  .gpill button.on{background:var(--card); box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .cbx{width:26px; height:26px; border-radius:9px; border:2px solid var(--line); background:var(--card);
    display:grid; place-items:center; color:#fff; font-weight:800; font-size:14px; flex:0 0 auto}
  .cbx.on{background:var(--teal); border-color:var(--teal)}
  .del-x{background:transparent; color:var(--coral); font-size:17px; font-weight:800; padding:4px 7px}
  .avgrid{display:flex; flex-wrap:wrap; gap:6px}
  .avgrid button{width:38px;height:38px;border-radius:12px;background:var(--chip);font-size:19px;display:grid;place-items:center}
  .avgrid button.on{background:var(--gold); box-shadow:0 0 0 2px var(--gold-deep) inset}

  .who-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:4px 2px}
  .who-card{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px 10px; text-align:center; box-shadow:var(--shadow)}
  .who-card .big{width:62px;height:62px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:31px;background:var(--chip)}
  .who-card .nm{font-size:15px; font-weight:800; margin:0}
  .who-card .sub{font-size:11.5px; color:var(--ink-soft); margin:3px 0 0}
  .who-card.par{grid-column:1 / -1; background:linear-gradient(150deg,#2E5A6B,#1B3A47); color:#fff; border:0}
  .who-card.par .big{background:rgba(255,255,255,.18)} .who-card.par .sub{color:rgba(255,255,255,.8)}

  .overlay{position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:24px; color:#fff;
    background:linear-gradient(165deg,#0B6763 0%,#159A92 55%,#F4B93C 165%)}
  .overlay h2{font-size:25px; margin:10px 0 4px; text-wrap:balance}
  .overlay .res{background:rgba(255,255,255,.14); border-radius:20px; padding:15px 20px; margin:13px 0; width:100%; max-width:258px}
  .overlay .res .r{display:flex; justify-content:space-between; font-size:14.5px; margin:7px 0; font-weight:700}
  .overlay .res .r b{color:#FFE29A}
  .cert{background:#FFFDF6; color:#5B4300; border:3px double var(--gold-deep); border-radius:16px; padding:15px 17px; width:100%; max-width:268px; margin-bottom:13px}
  .cert h3{margin:0 0 4px; font-size:16.5px} .cert p{margin:0; font-size:12.5px; line-height:1.7}
  .confetti{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .cf{position:absolute; width:9px; height:14px; top:-20px; border-radius:2px; opacity:.95}
  @media (prefers-reduced-motion: no-preference){
    .cf{animation:fall linear forwards}
    @keyframes fall{ to{ transform:translateY(770px) rotate(540deg); opacity:.7 } }
    .pop{animation:pop .45s ease}
    @keyframes pop{ 0%{transform:scale(.6); opacity:0} 100%{transform:scale(1); opacity:1} }
  }
  .toast{position:absolute; bottom:72px; inset-inline:12px; z-index:20; background:var(--ink); color:var(--ground);
    border-radius:14px; padding:11px 14px; font-size:12.5px; font-weight:700; text-align:center; box-shadow:var(--shadow)}

  @media (max-width:520px){
    .page{padding:9px 7px 20px; gap:9px}
    .logo h1{font-size:21px}
    .phone{width:100%; border-radius:24px; padding:6px}
    .screen{border-radius:19px; height:calc(100dvh - 160px); min-height:520px}
    .sync{font-size:11px}
  }
</style>

function addMove(kidId,kind,label,pts,ref){
  S.moves.unshift({id:'m'+(seq++),kidId,kind,label,pts,ref:ref||{},t:stamp(),
    by:(S.role==='child'?((cur()||{}).name||''):(myName||t('parent'))),undone:false});
  if(S.moves.length>80) S.moves.pop();
}
function notify(kidId,text){
  const k=kid(kidId); if(!k)return;
  k.notices=k.notices||[]; k.notices.unshift({text,t:stamp()});
  if(k.notices.length>4) k.notices.pop();
}
function clearNotices(kidId){ const k=kid(kidId); if(k)k.notices=[]; render() }
function nm(o){ return o && o.n ? (o.n[LI]!==undefined?o.n[LI]:o.n[1]) : (o&&o.name)||'' }
function sub(o){ return o && o.s ? (o.s[LI]!==undefined?o.s[LI]:o.s[1]) : '' }
function freqLabel(w){ const f=FREQ.find(x=>x[3]===w); return f?(f[LI]!==undefined?f[LI]:f[1]):'' }
function kid(id){ return S.kids.find(k=>k.id===id) }
function cur(){ return kid(S.curKid)||S.kids[0] }
function appKids(){ return S.kids.filter(k=>k.usesApp) }
function dToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }
function daysInPeriod(){ return S.period==='daily'?1:(S.period==='monthly'?28:7) }
function normTask(x){                                   // migrate old {w} tasks
  if(!x.kind){ if(x.w>=7){ x.kind='daily'; x.per=Math.max(1,Math.round(x.w/7)) } else { x.kind='period'; x.per=Math.max(1,x.w||1) } }
  if(!x.per) x.per=1; return x;
}
function capOf(x){ normTask(x); return x.kind==='daily' ? x.per*daysInPeriod() : x.per }
function dayCap(x){ normTask(x); return x.kind==='daily' ? x.per : 0 }
function dayDoneOf(x){ return (x.day===dToday())?(x.dayDone||0):0 }
function addDay(x){ const d=dToday(); if(x.day!==d){ x.day=d; x.dayDone=0 } x.dayDone=(x.dayDone||0)+1 }
function subDay(x){ if(x.day===dToday()&&x.dayDone>0) x.dayDone-- }
function periodWord(){ return S.period==='daily'?['اليوم','اليوم','day'][LI]
  :(S.period==='monthly'?['الشهر','الشهر','month'][LI]:['الأسبوع','الأسبوع','week'][LI]) }
function times(n){ if(LI===2) return n+'×'; return n===1?'مرة':(n===2?'مرتين':n+' مرات') }
function kindWord(k){ return k==='daily' ? ['كل يوم','كل يوم','Every day'][LI]
  : (LI===2?'Per '+periodWord():'في '+periodWord()) }
function freqText(x){
  normTask(x);
  if(x.kind==='daily') return LI===2?`every day, ${x.per}×`:`كل يوم · ${times(x.per)}`;
  return LI===2?`${x.per}× per ${periodWord()}`:`${times(x.per)} في ${periodWord()}`;
}
function possible(k){ return (k.tasks||[]).reduce((a,x)=>a+x.pts*capOf(x),0) }
function doneOf(x){ return x.done||0 }
function pendOf(id){ return S.pending.filter(p=>p.kidId===id) }
function pendCountTask(kidId,taskId){ return S.pending.filter(p=>p.kidId===kidId&&p.taskId===taskId).length }
function pendToday(kidId,taskId){ return S.pending.filter(p=>p.kidId===kidId&&p.taskId===taskId&&p.day===dToday()).length }
function leftOf(kidId,x){                                // how many more may be sent right now
  const periodLeft=capOf(x)-doneOf(x)-pendCountTask(kidId,x.id);
  if(x.kind!=='daily') return periodLeft;
  return Math.min(periodLeft, dayCap(x)-dayDoneOf(x)-pendToday(kidId,x.id));
}
function pendPts(id){ return pendOf(id).reduce((a,p)=>a+p.pts,0) }
function heldOf(id){ return S.rewardReqs.filter(r=>r.kidId===id&&r.st==='asked').reduce((a,r)=>{const w=S.rewards.find(x=>x.id===r.rwId);return a+(w?w.cost:0)},0) }
function availOf(k){ return Math.max(0,k.wallet-heldOf(k.id)) }
function pct(a,b){ return b>0?Math.min(100,Math.round(a/b*100)):0 }
function gw(k,m,f){ return k&&k.g==='girl'?f:m }
function yearsW(n){ return LI===2?'yrs':((n>=3&&n<=10)?'سنوات':'سنة') }
function inbox(){ return S.pending.length

  + S.rewardReqs.filter(r=>r.st==='asked'||r.st==='todo').length }

async function cloudCreate(){
  syncSt='syncing'; syncChip(); rev=1;          // never publish at rev 0 — joiners compare revisions
  try{ const r=await fetch('https://www.npoint.io/documents',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:JSON.stringify(packS())})});
    const d=await r.json();
    if(d&&d.token){ famToken=d.token; syncSt='ok'; save(); startPoll(); syncChip(); return d.token } }catch(e){}
  syncSt='err'; syncChip(); return null;
}
async function cloudPush(){
  if(!famToken)return;
  if(!S.kids.length)return;      // SAFETY: an empty phone must never overwrite a real family
  rev++;
  syncSt='syncing'; syncChip();
  try{ const r=await fetch('https://api.npoint.io/'+famToken,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(packS())}); syncSt=r.ok?'ok':'err' }
  catch(e){ syncSt='err' }
  syncChip(); save();
}
function queuePush(){ if(!famToken)return; clearTimeout(pushT); pushT=setTimeout(cloudPush,700) }
async function cloudPull(force){
  if(!famToken)return false;
  try{ const r=await fetch('https://api.npoint.io/'+famToken+'?_='+Date.now()); if(!r.ok)throw 0;
    const d=await r.json();
    // SAFETY: a wiped record must never destroy a phone that still holds the family — heal it instead
    if((!d.kids||!d.kids.length) && S.kids.length){
      syncSt='ok'; syncChip();
      rev=Math.max(rev,(d.rev||0))+1; cloudPush();
      return true;
    }
    if(force||(d.rev||0)>rev){ pulling=true; applyS(d); applyDir(); render(); pulling=false }
    syncSt='ok'; syncChip(); save(); return true }
  catch(e){ syncSt='err'; syncChip(); return false }
}

  const Pr=(id,ico,pts,per,n)=>({id,ico,pts,kind:'period',per,n,on:true});  // any day in the period

    A.push(Dy('teeth','🦷',2,2,['غسل السنان','تنظيف الأسنان','Brush teeth']),
      Dy('toys','🧸',3,1,['ترتيب اللعب','ترتيب الألعاب','Tidy the toys']),
      Dy('polite','😊',2,1,['كلام مهذب','كلمات مهذبة','Polite words']),

      Dy('sleep','🌙',2,1,['ينام بدري','النوم مبكرًا','Sleep on time']));

    A.push(Dy('teeth','🦷',2,2,['غسل السنان','تنظيف الأسنان','Brush teeth']),
      Pr('hw','📚',5,5,['الواجب','الواجب المدرسي','Homework']),
      Pr('sport','⚽',10,2,['التمرين','التمرين الرياضي','Sports practice']),
      Pr('family','🏡',3,3,['يساعد في البيت','المساعدة في المنزل','Help at home']),
      Dy('sibling','💛',2,1,['معاملة حلوة مع الأخوات','حسن معاملة الإخوة','Kind to siblings']),
      Pr('room','🛏️',4,3,['ترتيب الأوضة','ترتيب الغرفة','Tidy the room']));
  }else{
    if(rel) A.push(Dy('pray','🕌',2,5,['الصلاة','الصلاة','Prayers']),Dy('quran','📖',5,1,['ورد القرآن','ورد القرآن','Quran reading']));
    A.push(Pr('study','📚',5,5,['المذاكرة','المذاكرة','Study']),
      Pr('sport','🏀',10,2,['الرياضة','الرياضة','Sport']),
      Pr('chore','🧹',4,3,['مسؤولية في البيت','مسؤولية منزلية','Home responsibility']),
      Dy('time','⏰',3,1,['ينام ويصحى في معاده','الالتزام بمواعيد النوم','Sleep & wake on time']),
      Pr('skill','🎨',5,2,['يطور مهارة','تطوير مهارة','Build a skill']),
      Pr('others','🤲',3,2,['يساعد غيره','مساعدة الآخرين','Help others']));
  }
  return A;
}

function wDelKid(i){
  if(S.wiz.kids.length<=1)return;

  S.wiz.kids.splice(i,1); S.wiz.sel.splice(i,1); S.wiz.selAge.splice(i,1);

function wRel(){ S.wiz.religious=!S.wiz.religious; render() }

function wBuild(i){ const w=S.wiz,k=w.kids[i];
  if(!w.sel[i]){ w.sel[i]=suggestFor(k.age,w.religious); w.selAge[i]=k.age; return }
  if(w.touched&&w.touched[i]) return;               // never silently wipe the parent's edits
  if(w.selAge[i]!==k.age||w.selRel!==w.religious){ w.sel[i]=suggestFor(k.age,w.religious); w.selAge[i]=k.age } }
function wTouch(){ const w=S.wiz; w.touched=w.touched||{}; w.touched[w.ki]=true }
function wPoss(i){ return (S.wiz.sel[i]||[]).filter(x=>x.on).reduce((a,x)=>a+x.pts*capOf(x),0) }
function wKind(id,k){ const x=S.wiz.sel[S.wiz.ki].find(a=>a.id===id); x.kind=k; wTouch(); render() }
function wPer(id,d){ const x=S.wiz.sel[S.wiz.ki].find(a=>a.id===id); x.per=Math.min(5,Math.max(1,(x.per||1)+d)); wTouch(); render() }
function wItem(id){ const x=S.wiz.sel[S.wiz.ki].find(a=>a.id===id); x.on=!x.on; wTouch(); render() }
function wBump(id,d){ const x=S.wiz.sel[S.wiz.ki].find(a=>a.id===id); x.pts=Math.max(1,x.pts+d); wTouch(); render() }
function wDelItem(id){ const w=S.wiz; w.sel[w.ki]=w.sel[w.ki].filter(a=>a.id!==id); wTouch(); render() }
function wCopy(j){ const w=S.wiz;
  if(w.armed!==j){ w.armed=j; render(); return }
  w.backups=w.backups||{};
  if(w.backups[w.ki]===undefined) w.backups[w.ki]=w.sel[w.ki];   // keep the ORIGINAL, not the last copy
  w.armed=null;
  w.sel[w.ki]=JSON.parse(JSON.stringify(w.sel[j])); w.selAge[w.ki]=w.kids[w.ki].age; wTouch(); render() }
function wUndo(){ const w=S.wiz;
  if(w.backups&&w.backups[w.ki]!==undefined){ w.sel[w.ki]=w.backups[w.ki]; delete w.backups[w.ki]; render() } }
function wRw(id){ const r=S.wiz.rw.find(x=>x.id===id); r.on=!r.on; render() }
function wRwCost(id,d){ const r=S.wiz.rw.find(x=>x.id===id); r.cost=Math.max(5,r.cost+d*5); render() }
function wTarget(i,d){ S.wiz.targets[i]=Math.max(5,Math.min(wPoss(i),S.wiz.targets[i]+d*5)); render() }
function wSetTarget(i,v){ S.wiz.targets[i]=Math.max(5,Math.min(wPoss(i),v)); render() }

function wNext(){
  const w=S.wiz;
  if(w.step===1){ if(!w.family.trim()) w.family=['عيلتنا','عائلتنا','Our family'][LI]; w.step=2 }
  else if(w.step===2){
    const bad=w.kids.find(k=>k.usesApp&&(k.pin||'').length<4);
    if(bad){ toast([`${bad.name||'الطفل'} لازم رقم سري ٤ أرقام`,`${bad.name||'الطفل'} يحتاج رقمًا سريًا من ٤ أرقام`,`${bad.name||'This child'} needs a 4-digit PIN`][LI]); return }
    const pins=w.kids.filter(k=>k.usesApp).map(k=>k.pin);
    if(new Set(pins).size!==pins.length){ toast(['كل طفل لازم رقم مختلف','لكل طفل رقم مختلف','Each child needs a different PIN'][LI]); return }
    w.kids.forEach((k,i)=>{ if(!k.name.trim())k.name=['طفل','طفل','Child'][LI]+' '+(i+1) }); w.step=3 }
  else if(w.step===3){
    if((w.pin||'').length<4){ toast(['رقم بابا وماما لازم ٤ أرقام','رقم ولي الأمر يجب أن يكون ٤ أرقام','The parent PIN needs 4 digits'][LI]); return }
    if(w.kids.some(k=>k.usesApp&&k.pin===w.pin)){ toast(['رقم بابا وماما لازم يكون مختلف عن أرقام الأطفال','يجب أن يختلف رقم ولي الأمر عن أرقام الأطفال','The parent PIN must differ from the children’s'][LI]); return }
    w.selRel=w.religious; w.ki=0; wBuild(0); w.step=4 }
  else if(w.step===4){ if(w.ki<w.kids.length-1){ w.ki++; wBuild(w.ki) } else { w.step=5 } }
  else if(w.step===5){ if(!w.rw.some(r=>r.on)){ toast(t('rwNone')); return }
    w.kids.forEach((k,i)=>{ w.targets[i]=Math.max(5,Math.round(wPoss(i)*0.75/5)*5) }); w.step=6 }
  else if(w.step===6){ w.step=7 }
  render();
}

/* reward form (wizard + settings) */
const rwf={on:false,name:'',ico:'🎁',cost:50};
function rwfOpen(){ Object.assign(rwf,{on:true,name:'',ico:'🎁',cost:50}); render() }
function rwfName(v){ rwf.name=v } function rwfIco(i){ rwf.ico=i; render() }
function rwfCost(d){ rwf.cost=Math.max(5,rwf.cost+d*5); render() }
function rwfSave(inWiz){
  if(!rwf.name.trim()){ toast(['اكتب اسم المكافأة الأول','أدخل اسم المكافأة أولًا','Enter a reward name first'][LI]); return }
  const nme=rwf.name.trim();
  const item={id:'r'+(seq++),ico:rwf.ico,cost:rwf.cost,n:[nme,nme,nme]};
  if(inWiz) S.wiz.rw.push({...item,on:true}); else { S.rewards.push(item); logIt('🎁 + '+nme) }
  rwf.on=false; render();
}
function rwForm(inWiz){
  if(!rwf.on) return `<div class="card row" style="justify-content:center"><button class="btn btn-ghost" onclick="rwfOpen()">+ ${t('addRw')}</button></div>`;
  return `<div class="card"><label class="lbl">${t('taskNameL')}</label>
    <input class="inp" value="${rwf.name}" placeholder="${t('rwNamePh')}" oninput="rwfName(this.value)">
    <label class="lbl" style="margin-top:10px">${t('icon')}</label>
    <div class="row" style="flex-wrap:wrap;gap:6px">${RW_ICONS.map(i=>`<button class="btn ${rwf.ico===i?'btn-gold':'btn-ghost'}" style="padding:7px 10px;font-size:17px" onclick="rwfIco('${i}')">${i}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px;justify-content:space-between"><span class="lbl" style="margin:0">${t('cost')}</span>${stepperH('rwfCost',rwf.cost)}</div>
    <div class="row" style="margin-top:14px;gap:8px"><button class="btn btn-teal grow" onclick="rwfSave(${inWiz?'true':'false'})">${t('save')} ✓</button>
    <button class="btn btn-ghost" onclick="rwf.on=false;render()">${t('cancel')}</button></div></div>`;
}

/* ================= profile switcher + PIN ================= */
function goSwitch(){ S.mode='switch'; S.toast=null; S.afterPin=null; S.pinErr=false; S.ui.joinOpen=false;
  if(S.parentPin) unlocked=false; save(); render() }
function pickKid(id){
  const k=kid(id); if(!k)return;
  if(k.pin){ S.mode='pin'; S.pinFor=id; S.pinErr=false; render(); return }
  enterKid(id);
}
function enterKid(id){ S.role='child'; S.curKid=id; S.mode='app'; S.childTab='today'; unlocked=false; save(); render() }
function pickParent(){
  if(S.parentPin&&!unlocked){ S.mode='pin'; S.pinFor='parent'; S.pinErr=false; render(); return }
  enterParent();
}
function enterParent(){ S.role='parent'; S.mode= myName?'app':'whoami'; S.parentTab='family'; save(); render() }
function setMyName(n){ myName=n; save(); S.mode='app'; render() }
function tryPin(v){
  const f=S.pinFor;
  if(f==='parent'){
    if(v===S.parentPin){ unlocked=true; S.pinErr=false; save();
      if(S.afterPin==='wizard'){ S.afterPin=null; startWizard(); return } enterParent(); return }
  } else { const k=kid(f); if(k&&v===k.pin){ S.pinErr=false; enterKid(f); return } }
  S.pinErr=true; render();
}

function undoMove(id){
  const m=S.moves.find(x=>x.id===id); if(!m||m.undone)return;
  const k=kid(m.kidId); if(!k)return;
  if(m.kind==='approve'){
    const tk=k.tasks.find(x=>x.id===m.ref.taskId);
    if(tk&&doneOf(tk)>0){ tk.done=doneOf(tk)-1; if(tk.kind==='daily')subDay(tk) }
    k.week-=m.pts; S.quest.prog=Math.max(0,S.quest.prog-m.pts);
    notify(m.kidId,[`اتشال اعتماد «${m.label}» −${m.pts}`,`أُلغي اعتماد «${m.label}» −${m.pts}`,`“${m.label}” approval removed −${m.pts}`][LI]);
  }
  else if(m.kind==='reject'){
    const tk=k.tasks.find(x=>x.id===m.ref.taskId); if(tk)delete tk.rej;
    S.pending.push({id:'q'+(seq++),kidId:m.kidId,taskId:m.ref.taskId,pts:m.ref.pts,ico:m.ref.ico,n:m.ref.n,day:m.ref.day||dToday()});
    notify(m.kidId,[`بابا وماما رجّعوا «${m.label}» للمراجعة تاني 👍`,`أُعيد «${m.label}» إلى المراجعة 👍`,`“${m.label}” was sent back for review 👍`][LI]);
  }
  else if(m.kind==='deduct'){
    k.week+=m.pts;
    const d=(k.deductions||[]).find(x=>x.id===m.ref.dedId);
    if(d) k.deductions=k.deductions.filter(x=>x.id!==m.ref.dedId);
    notify(m.kidId,[`اتشال خصم «${m.label}» +${m.pts} رجعوا لك 🎉`,`أُلغي خصم «${m.label}» وأُعيدت ${m.pts} 🎉`,`“${m.label}” deduction removed, +${m.pts} back 🎉`][LI]);
  }
  else if(m.kind==='bonus'){
    k.week-=m.pts;
    if(m.ref.medal) k.achievements=(k.achievements||[]).filter(a=>nm(a)!==m.label);
    notify(m.kidId,[`اتعدلت مكافأة «${m.label}» −${m.pts}`,`عُدّلت مكافأة «${m.label}» −${m.pts}`,`“${m.label}” reward corrected −${m.pts}`][LI]);
  }

function closePeriod(kidId){
  const k=kid(kidId);
  const active=k.week!==0||k.tasks.some(x=>doneOf(x)>0)||(k.deductions||[]).length>0;
  if(!active){ S.ui.closing=null; toast(['مفيش حاجة تتقفل — الفترة لسه فاضية','لا شيء لإغلاقه — الفترة فارغة','Nothing to close — the period is empty'][LI]); return }
  const net=k.week, hit=net>=k.target, bonus=hit?Math.round(net*S.bonusPct/100):0;
  if(net>0) k.wallet+=net+bonus;
  if(hit) k.lvl=(k.lvl||1)+1;
  k.lastClose={net,bonus,hit,target:k.target};
  k.week=0; k.deductions=[]; k.notices=[];
  k.tasks.forEach(x=>{ x.done=0; x.dayDone=0; delete x.day; delete x.rej });
  S.pending=S.pending.filter(p=>p.kidId!==kidId);
  S.moves=S.moves.filter(m=>m.kidId!==kidId);      // closed period → no more direct undo (PRD §26)
  logIt(`🏁 ${k.name} — ${net}/${k.lastClose.target}${hit?' 🏆':''}`);
  S.ui.panel=null; S.ui.closing=null;
  S.ceremonyKid=kidId; S.ceremonyReal=true; S.ceremony=true; S.cert=false; render();
}

    ? `<span class="num">${['النهارده','اليوم','today'][LI]} ${dDone}/${dCap}</span> · <span class="num muted">${['الفترة','الفترة','period'][LI]} ${dn}/${cap}</span>`
    : `<span class="num">${dn}/${cap}</span>`;
  const rej=x.rej?`<p class="t-sub" style="color:var(--coral)">${['السبب','السبب','Reason'][LI]}: ${x.rej}</p>`:'';
  const doneToday=isDaily&&dDone>=dCap;

  if(x.type==='prayer'){
    let b=''; for(let i=0;i<5;i++) b+=`<span class="bead${i<(dDone+dPend)?' on':''}"></span>`;
    const act=parentMode
      ? `<div class="row" style="gap:5px">${dDone>0?`<button class="btn btn-ghost btn-sm" onclick="parentUndo('${k.id}','${x.id}')">↩</button>`:''}
         ${doneToday?`<span class="stamp ok">✓</span>`:`<button class="btn btn-teal btn-sm" onclick="parentRecord('${k.id}','${x.id}')">+1 ✓</button>`}</div>`
      : (doneToday?`<span class="stamp ok">${['ما شاء الله ✓','ما شاء الله ✓','Mashallah ✓'][LI]}</span>`
        : left<=0?`<span class="stamp">${['مستني بابا ⏳','بانتظار الاعتماد ⏳','Waiting ⏳'][LI]}</span>`
        :`<button class="btn btn-teal" onclick="prayBead('${k.id}')">${['صليت ✓','صليت ✓','Prayed ✓'][LI]}</button>`);
    return `<div class="card row"><div class="ico">🕌</div><div class="grow">
      <p class="t-name">${nm(x)}</p><div class="beads">${b}</div>
      <p class="t-sub">${counter}</p>${rej}</div>${act}</div>`;
  }
  let act;
  if(parentMode){
    act=`<div class="row" style="gap:5px">${dn>0?`<button class="btn btn-ghost btn-sm" onclick="parentUndo('${k.id}','${x.id}')">↩</button>`:''}
      ${(allDone||dayFull)?`<span class="stamp ok num">✓</span>`
        :`<button class="btn btn-teal btn-sm" onclick="parentRecord('${k.id}','${x.id}')">${['سجّلها ✓','سجّلها ✓','Record ✓'][LI]}</button>`}</div>`;
  } else {
    if(allDone) act=`<span class="stamp ok num">✓ ${dn}/${cap}</span>`;
    else if(doneToday) act=`<span class="stamp ok">${['خلصت النهارده ✓','اكتمل اليوم ✓','Done today ✓'][LI]}</span>`;
    else if(left<=0) act=`<span class="stamp">${['مستني بابا ⏳','بانتظار الاعتماد ⏳','Waiting ⏳'][LI]}</span>`;
    else if(x.rej) act=`<button class="btn btn-coral" onclick="submitTask('${k.id}','${x.id}')">${['حاول تاني ↻','حاول مجددًا ↻','Try again ↻'][LI]}</button>`;
    else act=`<button class="btn btn-teal" onclick="submitTask('${k.id}','${x.id}')">${t('done')} ✓</button>`;
  }
  return `<div class="card row"><div class="ico">${x.ico}</div><div class="grow">
    <p class="t-name">${nm(x)}${isDaily?'':` <span class="stamp" style="padding:2px 7px;font-size:10px">${['أي يوم','أي يوم','any day'][LI]}</span>`}</p>
    <p class="t-sub"><b>+${x.pts}</b> · ${freqText(x)}</p>
    <p class="t-sub">${counter}${pn?` · +${pn} ⏳`:''}</p>${rej}</div>${act}</div>`;
}

function childRewards(){

    <h2>${['على إيه هتصرف كنزك؟ 🎁','بمَ ستنفق كنزك؟ 🎁','What will you spend on? 🎁'][LI]}</h2>${mascotBlock(k)}</div>

      <p class="t-sub">${['لو اترفض الطلب النقاط بترجعلك كاملة 😉','إذا رُفض الطلب تُعاد النقاط كاملة 😉','If refused, your points come back in full 😉'][LI]}</p></div></div>
    <div style="height:14px"></div>
    <div class="rw-grid">${S.rewards.map(r=>{
      const q=S.rewardReqs.filter(x=>x.kidId===k.id&&x.rwId===r.id).slice(-1)[0];
      const st=q?q.st:null;
      let btn;
      if(st==='asked') btn=`<button class="btn btn-ghost" disabled>${['مستنية ⏳','بانتظار ⏳','Pending ⏳'][LI]}</button>`;
      else if(st==='todo') btn=`<button class="btn btn-gold" disabled>${['جاية ليك 🎉','في الطريق 🎉','On the way 🎉'][LI]}</button>`;
      else btn = avail>=r.cost
        ? `<button class="btn btn-teal" onclick="askReward('${k.id}','${r.id}')">${['اطلبها','اطلبها','Request'][LI]}</button>`
        : `<button class="btn btn-ghost" disabled>${['كمّل ادخار 💪','واصل الادخار 💪','Keep saving 💪'][LI]}</button>`;
      return `<div class="rw">${k.goalRw===r.id?'<span class="fav">⭐</span>':''}<div class="big">${r.ico}</div>
        <p class="nm">${nm(r)}</p><p class="cost num">${r.cost} ${t('pts')}</p>${btn}</div>`;
    }).join('')}</div><div style="height:14px"></div>`;
}

function ceremonyHTML(){
  const k=kid(S.ceremonyKid)||cur(); if(!k)return'';
  const real=S.ceremonyReal&&k.lastClose;
  const net=real?k.lastClose.net:Math.max(0,k.week);            // preview uses the child's REAL points
  const bonus=real?k.lastClose.bonus:(net>=k.target?Math.round(net*S.bonusPct/100):0);
  const hit=real?k.lastClose.hit:(net>=k.target);
  if(!real&&!hit){
    return `<div class="overlay">
      <div class="pop" style="font-size:52px">🎯</div><h2>${['لسه بدري شوية!','ما زال أمامك بعض الطريق!','Not quite yet!'][LI]}</h2>
      <p style="margin:0;opacity:.9;font-size:14px">${[`عندك ${net} من ${k.target}. لما توصل للهدف هتشوف الاحتفال الحقيقي 🏆`,
        `لديك ${net} من ${k.target}. عند بلوغ الهدف سترى الاحتفال الحقيقي 🏆`,
        `You have ${net} of ${k.target}. Hit the target to see the real celebration 🏆`][LI]}</p>
      <div class="res"><div class="r"><span>${['باقي','بقي','To go'][LI]}</span><b class="num">${k.target-net}</b></div></div>
      <button class="btn btn-gold" onclick="closeCeremony()">${['يلا نكمّل 💪','لنواصل 💪','Keep going 💪'][LI]}</button></div>`;
  }
  if(real&&!hit){
    const close=net>=k.lastClose.target*0.5;
    return `<div class="overlay"><div class="confetti" id="cfbox"></div>
      <div class="pop" style="font-size:54px">🌱</div><h2>${['فترة جديدة يا '+k.name+'!','فترة جديدة يا '+k.name+'!','A new period, '+k.name+'!'][LI]}</h2>
      <p style="margin:0;opacity:.9;font-size:14px">${close
        ? [`جمعت ${Math.max(0,net)} من ${k.lastClose.target} — قربت جدًا!`,`جمعت ${Math.max(0,net)} من ${k.lastClose.target} — اقتربت كثيرًا!`,`You got ${Math.max(0,net)} of ${k.lastClose.target} — so close!`][LI]
        : [`الفترة دي كانت صعبة — نبدأ صفحة جديدة سوا 💪`,`كانت فترة صعبة — نبدأ صفحة جديدة معًا 💪`,`A tough one — let’s start fresh together 💪`][LI]}</p>
      <div class="res"><div class="r"><span>${['راح للمحفظة','انتقل للمحفظة','To wallet'][LI]}</span><b class="num">+${Math.max(0,net)}</b></div>
      <div class="r"><span>${['الهدف الجاي','الهدف القادم','Next target'][LI]}</span><b class="num">${k.target}</b></div></div>
      <button class="btn btn-gold" onclick="closeCeremony()">${['يلا نبدأ 💪','لنبدأ 💪','Let’s go 💪'][LI]}</button></div>`;
  }
  const inner=S.cert
    ? `<div class="cert pop"><div style="font-size:28px">🏅</div><h3>${['شهادة كنز','شهادة كنز','Kenz Certificate'][LI]}</h3>
       <p>${['تُمنح إلى','تُمنح إلى','Awarded to'][LI]} <b>${k.name}</b><br>${gw(k,
         ['لتحقيقه الهدف بتفوق','لتحقيقه الهدف بتفوق','for hitting the target'][LI],
         ['لتحقيقها الهدف بتفوق','لتحقيقها الهدف بتفوق','for hitting the target'][LI])}<br>
       ${net+bonus} ${t('pts')}</p><p style="margin-top:8px;font-size:11.5px">${['التوقيع: بابا وماما ❤️','التوقيع: الوالدان ❤️','Signed: Mom & Dad ❤️'][LI]}</p></div>
       <button class="btn btn-gold" onclick="closeCeremony()">${['اتحفظت في إنجازاتي','حُفظت في إنجازاتي','Saved to my medals'][LI]}</button>`
    : `<div class="pop" style="font-size:54px">🏆</div><h2>${['فترة رائعة يا '+k.name+'!','فترة رائعة يا '+k.name+'!','Great period, '+k.name+'!'][LI]}</h2>
       <p style="margin:0;opacity:.9;font-size:14px">${['وصلت للهدف… وكنزك كبر','وصلتَ للهدف… وكنزك كبر','You hit the target — your treasure grew'][LI]}</p>
       ${real?'':`<p style="margin:6px 0 0;opacity:.75;font-size:11.5px">👀 ${['دي تجربة للفرجة بس','هذه معاينة فقط','Preview only'][LI]}</p>`}
       <div class="res"><div class="r"><span>${['نقاط الفترة','نقاط الفترة','Period points'][LI]}</span><b class="num">${net} / ${real?k.lastClose.target:k.target}</b></div>
       <div class="r"><span>${['البونص','المكافأة','Bonus'][LI]} ${S.bonusPct}%</span><b class="num">+${bonus}</b></div>
       <div class="r"><span>${['راح للمحفظة','انتقل للمحفظة','To wallet'][LI]}</span><b class="num">+${net+bonus}</b></div></div>
       <button class="btn btn-gold" onclick="showCert()">${['افتح شهادتك 🏅','افتح شهادتك 🏅','Open your certificate 🏅'][LI]}</button>
       <button class="btn" style="background:transparent;color:#fff;margin-top:8px;font-size:13px" onclick="closeCeremony()">${['لاحقًا','لاحقًا','Later'][LI]}</button>`;
  return `<div class="overlay"><div class="confetti" id="cfbox"></div>${inner}</div>`;
}
/* ================= render + boot ================= */
function whoBar(){
  const el=document.getElementById('who'); if(!el)return;
  if(S.mode==='wizard'||!S.kids.length){ el.innerHTML=''; return }
  const k=S.role==='child'?cur():null;
  el.innerHTML=`<span class="av">${k?k.av:'👨‍👩‍👧'}</span><span>${k?k.name:(myName||t('parent'))}</span>
    <button onclick="goSwitch()">🔄 ${t('switchUser')}</button>`;
}
function render(){
  const vk=[S.mode,S.role,S.curKid,S.childTab,S.parentTab,S.wiz?S.wiz.step+'-'+S.wiz.ki:''].join('|');
  const el=document.querySelector('#screen .body, #screen .wiz-body');
  const pos=(el&&vk===lastView)?el.scrollTop:0;
  let h='';
  if(S.mode==='wizard') h=wizardHTML();
  else if(S.mode==='switch') h=switcherHTML();
  else if(S.mode==='pin') h=pinHTML();
  else if(S.mode==='whoami') h=whoamiHTML();
  else if(S.mode==='share') h=shareHTML();
  else if(S.mode==='recover') h=`<div class="wiz"><div class="wiz-body" style="text-align:center;padding-top:70px">
      <div style="font-size:48px">🔄</div><h2>${['بنرجّع عيلتك…','جارٍ استرجاع عائلتك…','Restoring your family…'][LI]}</h2>
      <p class="lead">${['ثواني بس','لحظات من فضلك','Just a moment'][LI]}</p></div></div>`;
  else if(S.mode==='confirmJoin') h=`<div class="wiz"><div class="wiz-body" style="text-align:center;padding-top:44px">
      <div style="font-size:48px">🔀</div><h2>${t('joinAsk')}</h2><p class="lead">${t('joinAskSub')}</p></div>
      <div class="wiz-foot"><button class="btn btn-ghost" style="flex:1;padding:12px 0" onclick="declineJoin()">${t('keepMine')}</button>
      <button class="btn btn-teal" style="flex:1;padding:12px 0" onclick="acceptJoin()">${t('joinNew')}</button></div></div>`;
  else if(!S.kids.length) h=`<div class="wiz"><div class="wiz-body" style="text-align:center;padding-top:60px">
      <div style="font-size:48px">💰</div><h2>${t('welcome')}</h2><p class="lead">${t('welcomeSub')}</p>
      <button class="btn btn-teal" style="width:100%;padding:13px 0" onclick="startWizard()">🪄 ${t('startFirst')}</button></div></div>`;
  else if(S.role==='child'){
    if(!cur()){ S.mode='switch'; return render() }
    if(!S.features.stories&&S.childTab==='stories') S.childTab='today';
    h='<div class="body">'+({today:childToday,wallet:childWallet,rewards:childRewards,stories:childStories}[S.childTab])()+'</div>'+childNav();
  } else {
    h='<div class="body">'+({family:parentFamily,approve:parentApprove,reports:parentReports,settings:parentSettings}[S.parentTab])()+'</div>'+parentNav();
  }
  if(S.toast&&['app'].includes(S.mode)){
    h+=`<div class="toast">${S.toast}</div>`;
    setTimeout(()=>{ if(S.toast){ S.toast=null; render() } },2600);
  }
  if(S.ceremony) h+=ceremonyHTML();
  document.getElementById('screen').innerHTML=h;
  const el2=document.querySelector('#screen .body, #screen .wiz-body');
  if(el2&&pos) el2.scrollTop=pos;
  lastView=vk;
  whoBar(); syncChip();
  if(S.ceremony) confetti();
  save(); maybeSync();
}
function shareHTML(){
  const ready=!!famToken;
  return `<div class="wiz"><div class="wiz-body" style="text-align:center">
    <div style="font-size:52px;padding-top:16px">${ready?'🔗':'🔄'}</div>
    <h2>${ready?t('linkReady'):t('linkPrep')}</h2>
    ${ready?`<p class="lead">${t('linkSub')}</p>
      <div class="card" style="word-break:break-all;font-size:11.5px;direction:ltr;text-align:center">${famLink()}</div>
      <button class="btn btn-teal" style="width:100%;margin-bottom:8px;padding:13px 0" onclick="shareWa()">📲 ${t('shareWa')}</button>
      <button class="btn btn-ghost" style="width:100%" onclick="copyLink()">📋 ${t('copyLink')}</button>`
    :`<p class="lead">${t('offlineNote')}</p>`}
    </div><div class="wiz-foot"><button class="btn btn-gold" style="flex:1;padding:13px 0;font-size:16px"
      onclick="S.mode='app';render()">${t('startNow')} ←</button></div></div>`;
}

if('serviceWorker' in navigator && location.protocol==='https:'){ try{ navigator.serviceWorker.register('sw.js') }catch(e){} }
(function boot(){
  const q=new URLSearchParams(location.search).get('fam');
  const famQ=(q&&/^[a-f0-9]{16,32}$/i.test(q))?q:null;
  const has=load();
  LI=S.lang||0; applyDir(); lastSnap=snapNow();
  if(famQ&&!famToken){
    famToken=famQ; rev=0; save(); render();
    cloudPull(true).then(ok=>{
      if(ok&&S.kids.length){ S.mode='switch'; startPoll() }
      else if(!ok){ famToken=null; save(); toast(['مفيش نت — افتح الرابط تاني','تعذّر الاتصال — افتح الرابط مجددًا','No connection — open the link again'][LI]) }
      render();
    });
  } else if(famQ&&famQ!==famToken){
    S.pendingJoin=famQ; S.mode='confirmJoin'; render();   // always re-offer; a declined link must not be blocked forever
  } else if(has&&S.kids.length){
    S.mode='switch'; render();
    if(famToken){ cloudPull(); startPoll() }
  } else if(famToken){
    // this phone knows a family but has no data yet — recover it before offering a new setup
    S.mode='recover'; render();
    cloudPull(true).then(ok=>{
      if(ok&&S.kids.length){ S.mode='switch'; startPoll() }
      else { freshData(); startWizard() }
      render();
    });
  } else {
    freshData(); startWizard();
  }
})();
</script>
